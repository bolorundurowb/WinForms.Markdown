name: Release

on:
  push:
    branches: [master]
    paths:
      - 'src/WinForms.Markdown/WinForms.Markdown.csproj'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Detect version from csproj
        id: version
        shell: pwsh
        run: |
          $content = Get-Content -Raw 'src/WinForms.Markdown/WinForms.Markdown.csproj'
          $match = [regex]::Match($content, '<Version>(?<version>.*?)</Version>')
          if (-not $match.Success) {
            throw 'No <Version> tag found in src/WinForms.Markdown/WinForms.Markdown.csproj'
          }

          $version = $match.Groups['version'].Value.Trim()
          Write-Host "Detected version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Ensure tag exists
        id: tag
        shell: pwsh
        run: |
          git fetch --tags --force
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"

          $existing = git tag --list $tag
          if ($existing) {
            Write-Host "Tag '$tag' already exists."
          } else {
            Write-Host "Tag '$tag' does not exist - creating and pushing it."
            git tag -a $tag -m "Release $tag"
            git push origin $tag
          }

      - name: Check whether release exists
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release '$tag' already exists - skipping build and release."
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "Release '$tag' does not exist - will build, pack, and create it."
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Build
        if: steps.release.outputs.exists == 'false'
        run: dotnet build src/WinForms.Markdown/WinForms.Markdown.csproj -c Release

      - name: Test
        if: steps.release.outputs.exists == 'false'
        run: dotnet test tests/WinForms.Markdown.Tests/WinForms.Markdown.Tests.csproj -c Release

      - name: Pack
        if: steps.release.outputs.exists == 'false'
        run: dotnet pack src/WinForms.Markdown/WinForms.Markdown.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true

      - name: Create GitHub Release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
