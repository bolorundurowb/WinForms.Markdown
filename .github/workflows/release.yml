name: Release

on:
  push:
    branches: [main, master]
    paths:
      - 'src/WinForms.Markdown/WinForms.Markdown.csproj'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Detect version from csproj
        id: version
        shell: pwsh
        run: |
          $content = Get-Content -Raw 'src/WinForms.Markdown/WinForms.Markdown.csproj'
          $match = [regex]::Match($content, '<Version>(?<version>.*?)</Version>')
          if (-not $match.Success) {
            throw 'No <Version> tag found in src/WinForms.Markdown/WinForms.Markdown.csproj'
          }

          $version = $match.Groups['version'].Value.Trim()
          Write-Host "Detected version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check whether tag already exists
        id: tag
        shell: pwsh
        run: |
          git fetch --tags --force
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"

          $existing = git rev-parse --verify --quiet "refs/tags/$tag"
          if ($existing) {
            Write-Host "Tag '$tag' already exists - skipping release."
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "Tag '$tag' does not exist - a release will be created."
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Create and push tag
        if: steps.tag.outputs.exists == 'false'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          git tag -a $tag -m "Release $tag"
          git push origin $tag

      - name: Build
        if: steps.tag.outputs.exists == 'false'
        run: dotnet build src/WinForms.Markdown/WinForms.Markdown.csproj -c Release

      - name: Test
        if: steps.tag.outputs.exists == 'false'
        run: dotnet test tests/WinForms.Markdown.Tests/WinForms.Markdown.Tests.csproj -c Release

      - name: Pack
        if: steps.tag.outputs.exists == 'false'
        run: dotnet pack src/WinForms.Markdown/WinForms.Markdown.csproj -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true

      - name: Create GitHub Release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
