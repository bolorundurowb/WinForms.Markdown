name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build WinForms.Markdown.slnx -c Release

      - name: Test
        run: dotnet test tests/WinForms.Markdown.Tests/WinForms.Markdown.Tests.csproj -c Release --no-build
